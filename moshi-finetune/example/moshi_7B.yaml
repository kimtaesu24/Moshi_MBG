# data
data:
  eval_data: '' # Optional Fill
  shuffle: true
  train_data: './daily-talk-contiguous' # Fill

# model
moshi_paths: 
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

full_finetuning: false # Activate lora.enable if partial finetuning
lora:
  enable: true # Set to False if full_finetuning is True
  rank: 128
  scaling: 2.
  ft_embed: false # Optional, set to True if you want to finetune the embedding layer

first_codebook_weight_multiplier: 100.
text_padding_weight: .5

# optim
duration_sec: 100
batch_size: 32
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2e-6
  weight_decay: 0.1
  pct_start: 0.05

# other
seed: 0
log_freq: 1
eval_freq: 100
do_eval: false
do_ckpt: true
ckpt_freq: 100


save_adapters: true # Must be False if full_finetuning is True

run_dir: "./run_dir"  # Fill

# This part is optional and can be kept commented out
wandb:
  project: "Moshi" # your wandb project name
  run_name: "Moshi_trial" # your wandb run name
  key: "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" # your wandb api key
  offline: False
